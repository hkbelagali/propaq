name: publish

on:
  release:
    types: [published]
  pull_request:
    branches:
      - main

jobs:
  typos:
    name: typo check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check spelling with typos
        uses: crate-ci/typos@v1.47.0

  prebuild:
    name: test, lint, type check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up environment
        run: pip install -e .[dev,cirq,ffsim]
      - name: Check formatting with ruff
        run: ruff format --check .
      - name: Lint with ruff
        run: ruff check .
      - name: Type check with mypy
        run: mypy propaq/
      - name: Run Python tests with coverage
        run: coverage run -m pytest
      - name: Check coverage threshold
        run: coverage report
      - name: Check Rust formatting with cargo
        run: cargo fmt --all -- --check
      - name: Lint Rust with clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - name: Generate PyO3 stubs
        run: cargo run -p propaq --bin stub_gen
      - name: Run Rust tests with cargo
        run: cargo test

  build-linux:
    if: github.event_name == 'release'
    needs:
      - prebuild
      - typos
    name: build distribution (ubuntu-latest)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          command: build
          args: --release --out dist --interpreter /opt/python/cp310-cp310/bin/python /opt/python/cp311-cp311/bin/python /opt/python/cp312-cp312/bin/python
          manylinux: auto
          docker-options: -e RUSTFLAGS=-Ctarget-cpu=x86-64
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-ubuntu-latest
          path: dist/

  build-macos-windows:
    if: github.event_name == 'release'
    needs:
      - prebuild
      - typos
    name: build distribution (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12"]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        env:
          RUSTFLAGS: ${{ matrix.os == 'windows-latest' && '-Ctarget-cpu=x86-64' || '' }}
        with:
          command: build
          args: --release --out dist --interpreter python
      - name: Store the distribution packages
        uses: actions/upload-artifact@v4
        with:
          name: python-package-distributions-${{ matrix.os }}-${{ matrix.python-version }}
          path: dist/

  publish:
    if: github.event_name == 'release'
    needs:
      - build-linux
      - build-macos-windows
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download all distribution packages
        uses: actions/download-artifact@v4
        with:
          pattern: python-package-distributions-*
          path: dist/
          merge-multiple: true
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
