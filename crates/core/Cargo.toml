[package]
name = "propaq-core"
version = "0.1.0"
edition = "2021"

[dependencies]
pyo3 = { version = "0.27", features = ["num-complex"] }
pyo3-stub-gen = "0.23"
num-complex = "0.4"
rayon = "1.10"
rustc-hash = "2"
hashbrown = { version = "0.15", default-features = false, features = ["inline-more"] }
smallvec = { version = "1", features = ["union"] }
flate2 = "1"
libloading = "0.8"
libc = "0.2"
