[package]
name = "propaq-majorana"
version = "0.1.0"
edition = "2021"

[dependencies]
propaq-core = { path = "../core" }
rayon = "1.10"
pyo3 = { version = "0.27", features = ["num-complex"] }
pyo3-stub-gen = "0.23"
num-complex = "0.4"
rustc-hash = "2"

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
num-complex = "0.4"

[[bench]]
name = "majorana_bench"
harness = false
