[package]
name = "propaq-surrogate"
version = "0.1.1"
edition = "2021"

[lib]
name = "propaq_surrogate"
crate-type = ["lib"]

[dependencies]
propaq-core = { path = "../propaq-core" }
pyo3 = { version = "0.27", features = ["num-complex"] }
pyo3-stub-gen = "0.23"
num-complex = "0.4"
rayon = "1.10"
rustc-hash = "2"
flate2 = "1"

[lints.rust]
unexpected_cfgs = { level = "allow" }
