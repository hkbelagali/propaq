<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="propaq logo">
  <!-- Propagating operator: a source term branching into a cone of daughter terms.

       The violet is explicit rather than `currentColor`: Material renders the logo
       as <img src="...">, and an externally referenced SVG has no host document to
       inherit `color` from, so `currentColor` would resolve to black. #8B5CF6 is
       picked to clear 4:1 against both grounds the mark sits on — the white header
       in light mode and the #1E1E21 header in dark — so one file serves both. -->
  <g fill="none" stroke="#8b5cf6" stroke-linecap="round" stroke-width="3.5">
    <path d="M14 32h10" />
    <path d="M24 32 44 16" opacity=".85" />
    <path d="M24 32h20" opacity=".85" />
    <path d="M24 32 44 48" opacity=".85" />
  </g>
  <g fill="#8b5cf6">
    <circle cx="14" cy="32" r="5.5" />
    <circle cx="46" cy="16" r="4" opacity=".8" />
    <circle cx="46" cy="32" r="4" opacity=".8" />
    <circle cx="46" cy="48" r="4" opacity=".8" />
  </g>
</svg>
