[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "propaq"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "qiskit~=2.4.1",
    "ffsim~=0.0.80"
    ]

[project.optional-dependencies]
dev = [
    "pytest~=8.0.2",
    "ruff~=0.9.4",
    "mypy~=1.13.0",
    "maturin>=1.7,<2",
    "coverage~=7.14.0"
]

[tool.maturin]
python-source = "."
module-name = "propaq._rust_core"
features = ["pyo3/extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]