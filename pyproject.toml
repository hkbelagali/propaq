[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "propaq"
dynamic = ["version"]
description = "Fast Majorana and Pauli propagation for quantum circuit simulation"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Hrishikesh Belagali", email = "belagal1@msu.edu" }
]
requires-python = ">=3.10"
keywords = [
    "quantum computing",
    "quantum simulation",
    "fermionic circuits",
    "Majorana propagation",
    "Pauli propagation",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = [
    "numpy>=1.24",
    "qiskit~=2.4.1",
    "ffsim~=0.0.80",
    "scipy>=1.10",
    "tqdm",
]

[project.urls]
Homepage = "https://hkbelagali.github.io/propaq"
Repository = "https://github.com/hkbelagali/propaq"
"Bug Tracker" = "https://github.com/hkbelagali/propaq/issues"
Documentation = "https://hkbelagali.github.io/propaq"

[project.optional-dependencies]
dev = [
    "pytest~=8.0.2",
    "ruff~=0.9.4",
    "mypy~=1.14.1",
    "maturin>=1.7,<2",
    "coverage~=7.14.0",
]
docs = [
    "mkdocs>=1.6",
    "mkdocs-material>=9.5",
    "mkdocstrings[python]>=0.26",
    "mkdocs-jupyter>=0.25",
    "mkdocs-autorefs>=1.2",
    "pymdown-extensions>=10.9",
]
cirq = [
    "cirq~=1.5.0",
]
openfermion = [
    "openfermion>=1.6",
]
hybrid = [
    "quimb",
]

[tool.maturin]
python-source = "."
module-name = "propaq._rust_core"
manifest-path = "crates/ext/Cargo.toml"
features = ["extension-module"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["benchmarks/", "examples/", "docs/", "propaq/_rust_core/__init__.pyi"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "D101", "D102", "D103", "D107", "D417"]
ignore = ["E501"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/datatypes/test_majorana.py" = ["E741"]
"tests/datatypes/test_pauli.py" = ["E743"]
"tests/**" = ["D101", "D102", "D103", "D107", "D417"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
warn_return_any = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["propaq._rust_core"]
disable_error_code = ["override"]

[[tool.mypy.overrides]]
module = [
    "propaq.datatypes.pauli.pauli",
    "propaq.datatypes.pauli.termsum",
    "propaq.datatypes.majorana.termsum",
    "propaq.circuits.pauli.circuit",
    "propaq.circuits.majorana.circuit",
    "propaq.circuits.majorana._ffsim_gates",
]
ignore_errors = true

[tool.coverage.run]
source = ["propaq"]
omit = [
    "propaq/_rust_core*",
    "propaq/datatypes/pauli/pauli.py",
    "propaq/datatypes/majorana/majorana.py",
]

[tool.coverage.report]
fail_under = 85
show_missing = true

